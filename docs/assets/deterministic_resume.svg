<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1500 2860" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic resume validation flow</title>
  <desc id="desc">A vertical flow that saves state, evicts residency, restores state, compares token IDs, and branches to resume_match yes or no.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#333333"/>
    </marker>
    <style>
      .node { fill: #ECECFF; stroke: #9370DB; stroke-width: 2; }
      .edge { stroke: #333333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 54px; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 48px; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="2860" fill="#ffffff"/>

  <rect class="node" x="430" y="40" width="640" height="150"/>
  <text class="label" x="750" y="115">Prefill prompt</text>

  <line class="edge" x1="750" y1="190" x2="750" y2="270"/>
  <rect class="node" x="430" y="280" width="640" height="150"/>
  <text class="label" x="750" y="355">Save state</text>

  <line class="edge" x1="750" y1="430" x2="750" y2="510"/>
  <rect class="node" x="430" y="520" width="640" height="230"/>
  <text class="label" x="750" y="615">
    <tspan x="750" dy="0">Decode baseline</tspan>
    <tspan x="750" dy="66">next token</tspan>
  </text>

  <line class="edge" x1="750" y1="750" x2="750" y2="830"/>
  <rect class="node" x="430" y="840" width="640" height="230"/>
  <text class="label" x="750" y="935">
    <tspan x="750" dy="0">Evict context/model</tspan>
    <tspan x="750" dy="66">residency</tspan>
  </text>

  <line class="edge" x1="750" y1="1070" x2="750" y2="1150"/>
  <rect class="node" x="430" y="1160" width="640" height="150"/>
  <text class="label" x="750" y="1235">Reload residency</text>

  <line class="edge" x1="750" y1="1310" x2="750" y2="1390"/>
  <rect class="node" x="430" y="1400" width="640" height="230"/>
  <text class="label" x="750" y="1495">
    <tspan x="750" dy="0">Restore saved</tspan>
    <tspan x="750" dy="66">state</tspan>
  </text>

  <line class="edge" x1="750" y1="1630" x2="750" y2="1710"/>
  <rect class="node" x="430" y="1720" width="640" height="230"/>
  <text class="label" x="750" y="1815">
    <tspan x="750" dy="0">Decode restored</tspan>
    <tspan x="750" dy="66">next token</tspan>
  </text>

  <line class="edge" x1="750" y1="1950" x2="750" y2="2030"/>
  <polygon class="node" points="750,2040 1010,2300 750,2560 490,2300"/>
  <text class="label" x="750" y="2267">
    <tspan x="750" dy="0">Token IDs</tspan>
    <tspan x="750" dy="66">match?</tspan>
  </text>

  <line class="edge" x1="750" y1="2560" x2="750" y2="2700"/>
  <rect x="680" y="2620" width="140" height="58" fill="#ffffff" opacity="0.92"/>
  <text class="edge-label" x="750" y="2650">Yes</text>
  <rect class="node" x="430" y="2710" width="640" height="150"/>
  <text class="label" x="750" y="2785">resume_match=yes</text>

  <line class="edge" x1="1010" y1="2300" x2="1180" y2="2300"/>
  <rect x="1062" y="2270" width="100" height="58" fill="#ffffff" opacity="0.92"/>
  <text class="edge-label" x="1112" y="2300">No</text>
  <rect class="node" x="1190" y="2225" width="280" height="150"/>
  <text class="label" x="1330" y="2270">
    <tspan x="1330" dy="0">resume</tspan>
    <tspan x="1330" dy="66">match=no</tspan>
  </text>
</svg>
